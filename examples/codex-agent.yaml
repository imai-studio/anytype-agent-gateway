version: 1
agent:
  name: Codex
  participantId: _participant_replace_with_bot_id
  aliases: [codex]
anytype:
  apiBase: http://127.0.0.1:31012
  apiKeyFile: ~/.config/aag/anytype-api-key
spaces:
  - name: My Anytype Space
    chatDiscovery:
      enabled: false
    chats:
      - name: sandbox
        wake:
          humans: mention
          agents: direct-mention
          allowedUsers: [_participant_replace_with_authorized_human_id]
    comments:
      mode: disabled
runtime:
  kind: codex
  command: codex-acp
  permissions: deny
  desktopProject: auto
  defaultProject: /absolute/path/to/default-project
  allowedProjects:
    - /absolute/path/to/another-project
  inactivityTimeoutSeconds: 0
  maxRunSeconds: 0
tools:
  anytype:
    enabled: true
    allowWrite: true
    allowArchive: false
    allowedSpaceIds: [_space_replace_me]
    allowedFileRoots:
      - /absolute/path/to/default-project
  codex:
    enabled: true
    command: codex
    sandbox: workspace-write
responses:
  mode: milestones
  streaming: true
  thinking: stream
  editIntervalMilliseconds: 900
