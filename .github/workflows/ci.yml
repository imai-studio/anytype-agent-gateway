name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Verify committed build artifacts
        run: git diff --exit-code -- dist packages/openclaw-anytype-channel/dist
      - run: test "$(node dist/cli.js --version)" = "$(node -p "require('./package.json').version")"
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.7
          cache-dependency-path: heart-adapter/go.sum
      - run: go test ./...
        working-directory: heart-adapter
      - run: go vet ./...
        working-directory: heart-adapter
      - run: go build ./...
        working-directory: heart-adapter
