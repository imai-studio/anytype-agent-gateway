name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Verify committed build artifacts
        run: git diff --exit-code -- dist packages/openclaw-anytype-channel/dist
      - run: test "$(node dist/cli.js --version)" = "$(node -p "require('./package.json').version")"
      - name: Run release metadata, compatibility, package, and install gates
        run: pnpm run release:gates
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.25.7
          cache-dependency-path: heart-adapter/go.sum
      - run: go test ./...
        working-directory: heart-adapter
      - run: go vet ./...
        working-directory: heart-adapter
      - run: go build ./...
        working-directory: heart-adapter
