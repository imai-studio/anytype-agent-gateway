name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: test "$(node dist/cli.js --version)" = "$(node -p "require('./package.json').version")"
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.7
          cache-dependency-path: heart-adapter/go.sum
      - run: go test ./...
        working-directory: heart-adapter
      - run: go vet ./...
        working-directory: heart-adapter
      - run: go build ./...
        working-directory: heart-adapter
