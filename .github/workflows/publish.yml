name: Publish CLI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@^11.5.1

      - name: Verify release tag
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${package_version}"

      - name: Verify package
        run: |
          pnpm run check
          test "$(node dist/cli.js --version)" = "$(node -p "require('./package.json').version")"
          npm pack --dry-run --json > /tmp/aag-pack.json
          node -e "const p=require('/tmp/aag-pack.json')[0]; for (const f of ['LICENSE','NOTICE','THIRD_PARTY_NOTICES.md','README.md','dist/cli.js']) if (!p.files.some(x => x.path === f)) throw new Error('missing package file: '+f)"

      - name: Publish to npm
        run: npm publish
