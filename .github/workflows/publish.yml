name: Publish CLI

on:
  release:
    types: [published]

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Require renamed repository
        run: |
          test "$GITHUB_REPOSITORY" = "imai-studio/knot" || {
            echo "Rename imai-studio/anytype-agent-gateway to imai-studio/knot first; see docs/release-checklist.md"
            exit 1
          }
      - name: Check out repository without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release tag and reviewed ancestry
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Verify package and compatibility gates
        run: |
          pnpm run check
          pnpm run release:gates
          pnpm run release:redirect
          test "$(node dist/cli.js --version)" = "$(node -p "require('./package.json').version")"
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.25.7
          cache-dependency-path: heart-adapter/go.sum
      - name: Verify Heart adapter
        working-directory: heart-adapter
        run: go test ./... && go vet ./...
      - name: Pack the reviewed release artifact
        run: |
          mkdir release-artifact
          npm pack --ignore-scripts --pack-destination release-artifact
          (cd release-artifact && sha256sum *.tgz > SHA256SUMS)
      - name: Upload reviewed package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: knot-npm-package
          path: |
            release-artifact/*.tgz
            release-artifact/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require renamed repository
        run: test "$GITHUB_REPOSITORY" = "imai-studio/knot"
      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Require OIDC-capable npm
        run: npm_version="$(npm --version)"; test "$(printf '%s\n' 11.5.1 "$npm_version" | sort -V | head -n1)" = "11.5.1"
      - name: Download reviewed package
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: knot-npm-package
          path: release-artifact
      - name: Publish to npm with provenance
        run: |
          (cd release-artifact && sha256sum --check SHA256SUMS)
          artifact="$(find release-artifact -maxdepth 1 -name '*.tgz' -type f)"
          test "$(tar -xOf "$artifact" package/package.json | node -e 'let s=""; process.stdin.on("data", d => s += d).on("end", () => process.stdout.write(JSON.parse(s).name))')" = "@imai/knot"
          test "$(tar -xOf "$artifact" package/package.json | node -e 'let s=""; process.stdin.on("data", d => s += d).on("end", () => process.stdout.write(JSON.parse(s).version))')" = "${GITHUB_REF_NAME#v}"
          npm publish "$artifact" --access public --provenance
